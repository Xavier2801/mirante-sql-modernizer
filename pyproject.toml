[project]
name = "mirante-sql-modernizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruan Xavier", email = "ruanxavierdossantos81@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "sqlglot>=30.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mirante-sql-modernizer = "mirante_sql_modernizer:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]